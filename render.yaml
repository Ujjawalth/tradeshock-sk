services:
  - type: web
    name: tradeshock-sk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard, never in git
      - key: AI_DAILY_CALL_LIMIT
        value: "300"  # per worker; caps API spend if someone hammers the site
      - key: AI_RATE_LIMIT_PER_MIN
        value: "10"
